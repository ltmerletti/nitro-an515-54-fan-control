# NitroFan example configuration.
#
# Copy to /etc/nitrofan/config.toml and edit for your machine.
# This file uses "mock" backend by default so it runs without hardware.
#
# WARNING: The EC register map below is a CANDIDATE from sibling research.
# It is UNVERIFIED on the actual AN515-54 unit. Do not switch to
# backend="ec" until Phase 0 staged verification is complete.

backend = "mock"
tick_s = 2
reassert_s = 10
min_percent = 25
emergency_c = 90
startup_mode = "auto"

# --- EC backend settings (candidate, unverified) ---
#
# These registers come from sibling device research. They have NOT been
# tested with actual EC writes on basement-server. The write_allowlist
# restricts which EC offsets the daemon will ever write.
#
# read_register values (0x13, 0x15) were originally hypothesized in sibling
# research as read-only percent readbacks. However, real hardware capture on
# AN515-54 disproved this: they are low bytes of 16-bit little-endian RPM
# readbacks (paired with 0x14 and 0x16), NOT percent.
# They are intentionally NOT in the write_allowlist.

[ec]
unlock_register = 0x03
unlock_value = 0x11
write_allowlist = [0x03, 0x21, 0x22, 0x37, 0x3A]

[ec.fans.cpu]
mode_register = 0x22
mode_auto = 0x04
mode_manual = 0x0C
speed_register = 0x37
speed_max = 0x64       # raw byte corresponding to 100% (candidate scaling)
read_register = 0x13   # candidate register (sibling hypothesized percent; hardware confirmed RPM low byte)

[ec.fans.gpu]
mode_register = 0x21
mode_auto = 0x10
mode_manual = 0x30
speed_register = 0x3A
speed_max = 0x64       # raw byte corresponding to 100% (candidate scaling)
read_register = 0x15   # candidate register (sibling hypothesized percent; hardware confirmed RPM low byte)

# --- Fan curves ---
#
# Each entry is [temperature_celsius, fan_percent].
# Temperatures must be strictly increasing. Percents are 0..100.
# Interpolation is linear between points. Below the first point, the
# fan runs at the first point's percent. Above the last, use its percent.

[curves]
cpu = [[45, 25], [60, 40], [70, 60], [80, 85], [88, 100]]
gpu = [[45, 25], [60, 40], [70, 60], [78, 85], [85, 100]]
